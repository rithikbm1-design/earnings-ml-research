[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnml"
version = "0.1.0"
description = "Do ML forecasts of firm profitability predict stock returns around earnings announcements?"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.5",
  "statsmodels>=0.14", "matplotlib>=3.8", "requests>=2.31", "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
